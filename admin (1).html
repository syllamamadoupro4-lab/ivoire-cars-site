<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IVOIRE CARS</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffffff; --surface:#ffffff; --ink:#111111; --muted:#555555;
  --green:#111111; --green-ink:#ffffff; --orange:#111111; --line:#e2e2e2; --soft:#f4f4f4;
  color-scheme:light;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
h1,h2,h3{line-height:1.12;margin:0;font-weight:800;letter-spacing:-.02em}
h1{font-size:clamp(2rem,8vw,3.4rem);color:var(--green)}
h2{font-size:clamp(1.5rem,5vw,2.1rem);margin-bottom:.4em}
p{margin:0}
a{color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:44px 0}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-weight:900;font-size:1.25rem;letter-spacing:-.02em;text-decoration:none}
.logo span{color:var(--green)}
.btn{display:inline-block;border:0;border-radius:10px;padding:13px 20px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;text-align:center}
.btn-green{background:var(--green);color:var(--green-ink)}
.btn-orange{background:var(--orange);color:#ffffff}
.btn-small{padding:9px 14px;font-size:.95rem}

.stripe{height:6px;background:#111111}

.hero{position:relative;overflow:hidden;padding:0 0 56px;background:linear-gradient(160deg,#ffffff 0%,#f1f1f1 100%)}
.hero::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:#111111;opacity:.06;top:-110px;right:-90px}
.hero::after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:#111111;opacity:.06;bottom:-110px;left:-90px}
.hero .wrap{position:relative;z-index:1}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.pills span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:.92rem;color:var(--green)}
.hero-photo{display:block;position:relative;z-index:1;width:100%;aspect-ratio:16/10;max-height:460px;object-fit:cover;object-position:center 58%;margin:0 0 30px}
.hero p.lead{margin:16px 0 26px;color:var(--muted);max-width:34em;font-size:1.1rem}
.card{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--orange);border-radius:16px;padding:20px;box-shadow:0 14px 34px rgba(0,0,0,.12)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--green-ink)}
label{display:block;font-weight:600;margin:12px 0 6px}
select,input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
form .btn{width:100%;margin-top:18px}
.note{color:var(--muted);font-size:.92rem;margin-top:10px}

.steps{display:grid;gap:14px;margin-top:20px;counter-reset:s;padding:0;list-style:none}
.steps li{counter-increment:s;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.steps li::before{content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--orange);color:#ffffff;font-weight:800;display:grid;place-items:center}
.steps b{display:block}
.steps span{color:var(--muted)}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
.car{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.car .top{height:84px;background:linear-gradient(135deg,#f4f4f4,#e4e4e4);display:flex;align-items:flex-end;padding:12px 16px}
.badge{font-size:.85rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--green);color:var(--green-ink)}
.badge.v{background:#ffffff;color:#111111;border:1px solid #111111}
.car .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:4px;flex:1}
.car h3{font-size:1.15rem}
.car .meta{color:var(--muted);font-size:.95rem}
.car .btn{margin-top:12px}

.trust{background:var(--soft)}
.trust ul{padding:0;margin:16px 0 0;list-style:none;display:grid;gap:12px}
.trust li{padding-left:28px;position:relative}
.trust li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:900}

footer{padding:28px 0 90px;background:var(--green);color:#ffffff;font-size:.92rem;border-top:6px solid var(--orange)}

.nav{display:flex;align-items:center;gap:16px}
.nav .lnk{font-weight:700;text-decoration:none}
.agency{display:none;background:#111111;color:#ffffff}
body.agences .agency{display:block;min-height:70vh}
body.agences main > section:not(.agency){display:none}
.back{display:inline-block;margin-bottom:18px;color:#ffffff;font-weight:700}
.agency h2{color:#ffffff}
.agency .sub{color:#d0d0d0;margin-bottom:18px}
.agency ul{padding:0;margin:0 0 24px;list-style:none;display:grid;gap:12px}
.agency li{padding-left:28px;position:relative}
.agency li::before{content:"✓";position:absolute;left:0;font-weight:900}
.agency .card{color:var(--ink);border-top-color:#ffffff}
.agency .btn-white{background:#ffffff;color:#111111}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn-ghost{background:#ffffff;color:#111111;border:2px solid #111111}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer}
details p{margin-top:8px;color:var(--muted)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:#111111;color:#ffffff;border-radius:999px;padding:13px 20px;font-weight:700;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.28)}
@media (min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
  .split{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

textarea{width:100%;min-height:90px;padding:13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.msg-ok{margin:14px 0 0;padding:12px;border:2px solid #111111;border-radius:10px;font-weight:700}
#admin{display:none;background:var(--soft);min-height:100vh;padding-bottom:40px}
body.admin-mode #admin{display:block}
body.admin-mode>header,body.admin-mode>main,body.admin-mode>.fab,body.admin-mode>footer{display:none}
#admin .wrap{max-width:820px}
#admin .ad-head{background:#111111;color:#ffffff;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
#admin .ad-head .wrap{height:54px;display:flex;align-items:center;justify-content:space-between;gap:10px}
#admin .ad-head b{font-size:1.05rem}
#admin .ad-nav{background:#ffffff;border-bottom:1px solid var(--line);overflow-x:auto}
#admin .ad-nav .wrap{display:flex;gap:6px;padding-top:8px;padding-bottom:8px}
#admin .ad-nav button{border:0;background:transparent;font:inherit;font-weight:700;padding:9px 16px;border-radius:999px;cursor:pointer;color:#111111;white-space:nowrap}
#admin .ad-nav button[aria-pressed="true"]{background:#111111;color:#ffffff}
#admin .ad-main{padding-top:18px;padding-bottom:20px}
#admin .card{border-top:1px solid var(--line);box-shadow:none;margin-bottom:14px}
#admin .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
#admin .stat{background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}
#admin .stat b{display:block;font-size:2rem;line-height:1.1}
#admin .stat span{color:var(--muted);font-size:.85rem}
#admin .ad-row{display:flex;gap:8px;margin-top:10px;align-items:center}
#admin .ad-row select{flex:1;padding:9px}
#admin .ad-sure{background:#111111;color:#ffffff}
#admin .err{background:#ffffff;border:2px solid #111111;border-radius:12px;padding:12px;margin-bottom:12px;font-weight:600}
.chat-log{height:300px;overflow-y:auto;background:var(--soft);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin:10px 0}
.bub{max-width:82%;padding:9px 13px;border-radius:14px;font-size:.95rem;word-break:break-word}
.bub.me{align-self:flex-end;background:#111111;color:#ffffff}
.bub.them{align-self:flex-start;background:#ffffff;color:#111111;border:1px solid var(--line)}
.bub small{display:block;opacity:.6;font-size:.72rem;margin-top:3px}
.chat-row{display:flex;gap:8px}
.chat-row input{flex:1}
.chat-row .btn{width:auto;margin-top:0}
.ad-sub{display:flex;gap:6px;margin-bottom:12px}
.ad-sub button{border:1px solid #e2e2e2;background:#ffffff;color:#111111;font:inherit;font-weight:700;padding:9px 18px;border-radius:999px;cursor:pointer}
.ad-sub button[aria-pressed="true"]{background:#111111;color:#ffffff}
.chart{display:flex;gap:4px;align-items:flex-end;height:150px;margin-top:14px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.bars{display:flex;gap:2px;align-items:flex-end;height:120px;width:100%}
.bar{flex:1;min-height:2px;border-radius:3px 3px 0 0;position:relative}
.b1{background:#111111}.b2{background:#9a9a9a}
.bar span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:10px;color:#111111}
.col small{font-size:10px;color:#555555;margin-top:4px}
#admin .ad-head-in{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px}
#admin .ad-head-title{font-size:1.05rem;font-weight:700}
#admin .ad-burger{display:none}
#admin .ad-layout{display:flex;align-items:flex-start}
#admin .ad-side{width:250px;flex:none;background:#ffffff;border-right:1px solid var(--line);position:sticky;top:calc(54px + env(safe-area-inset-top,0px));height:calc(100vh - 54px);overflow-y:auto;padding:6px 10px 0;display:flex;flex-direction:column}
#admin .ad-side nav{flex:1}
#admin .ad-foot{position:sticky;bottom:0;background:#ffffff;padding:12px 0 20px;border-top:1px solid var(--line);margin-top:12px}
#admin .ad-logout{width:100%;border:1px solid #111111;background:#ffffff;color:#111111;font:inherit;font-weight:700;padding:11px 12px;border-radius:10px;cursor:pointer}
#admin .ad-logout:hover{background:#111111;color:#ffffff}
#admin .ad-content{flex:1;min-width:0}
#admin .ad-main{max-width:860px;margin:0 auto;padding:18px 16px 20px}
#admin.ad-wide .ad-main{max-width:1280px}
#admin .ad-grp{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#666666;margin:18px 10px 6px}
#admin .ad-item{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;font:inherit;font-weight:600;padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;color:#111111}
#admin .ad-item:hover{background:#f1f1f1}
#admin .ad-item[aria-pressed="true"]{background:#111111;color:#ffffff}
#admin .ad-badge{background:#111111;color:#ffffff;border-radius:999px;font-size:.75rem;padding:1px 8px}
#admin .ad-item[aria-pressed="true"] .ad-badge{background:#ffffff;color:#111111}
#admin .ad-backdrop{display:none}
#admin{min-width:1040px}
/* Organisation */
.org-views{flex-wrap:wrap;margin-bottom:16px}
.org-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.org-hero>div{background:#111111;color:#ffffff;border-radius:16px;padding:16px 14px}
.org-hero b{display:block;font-size:1.7rem;line-height:1.1}
.org-hero span{font-size:.8rem;opacity:.75}
.org-bar{height:6px;background:#333333;border-radius:99px;overflow:hidden;margin-top:8px}
.org-bar i{display:block;height:100%;background:#ffffff}
.org-add{background:#ffffff;border:1px dashed #9a9a9a;border-radius:14px;padding:12px 16px;margin-bottom:16px}
.org-add summary{cursor:pointer;font-weight:700;list-style:none}
.org-add[open] summary{margin-bottom:6px}
.org-kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.org-col{background:#ffffff;border:1px solid #e2e2e2;border-radius:16px;padding:10px;min-height:140px}
.org-col h4{margin:4px 4px 10px;display:flex;justify-content:space-between;align-items:center;font-size:.95rem}
.org-cnt{background:#111111;color:#ffffff;border-radius:999px;font-size:.75rem;padding:1px 9px}
.org-tk{background:#f7f7f7;border:1px solid #e2e2e2;border-radius:14px;padding:12px;margin-bottom:8px}
.org-tk.late{border:2px solid #111111;background:#ffffff}
.org-tk-t{font-weight:700;line-height:1.3}
.org-tk-m{display:flex;align-items:center;gap:8px;margin-top:8px;color:#5a5a5a;font-size:.9rem}
.org-tk-f{display:flex;gap:8px;align-items:center;margin-top:8px}
.org-sel{width:auto;flex:1;padding:8px 10px;border-radius:999px;font-size:.9rem}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid #111111;margin:0 4px 4px 0}
.chip.on{background:#111111;color:#ffffff}
.org-av{border-radius:50%;background:#111111;color:#ffffff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none;width:34px;height:34px;font-size:.8rem}
.org-av-l{width:64px;height:64px;font-size:1.3rem;margin:0 auto 10px}
.org-av-s{width:30px;height:30px;font-size:.72rem}
.org-del{background:none;border:0;color:#5a5a5a;font:inherit;font-size:.85rem;cursor:pointer;padding:6px 4px;text-decoration:underline}
.org-del.ad-sure{color:#111111;font-weight:700}
.org-list{display:flex;flex-direction:column;gap:8px}
.org-li{background:#ffffff;border:1px solid #e2e2e2;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.org-li.late{border:2px solid #111111}
.org-li-main{min-width:0;flex:1 1 200px}
.org-li-side{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.org-li-side .org-sel{width:auto;flex:none}
.org-tgh{font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;color:#5a5a5a;margin:18px 4px 8px;border-left:3px solid #111111;padding-left:8px}
.org-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.org-mem{background:#ffffff;border:1px solid #e2e2e2;border-radius:18px;padding:20px 16px;text-align:center}
.org-mem-n{font-weight:800;font-size:1.05rem}
.org-role{display:inline-block;margin:6px 0 8px;font-size:.8rem;font-weight:700;background:#f1f1f1;border-radius:999px;padding:3px 10px}
.org-tel{color:#111111;font-weight:600;text-decoration:none;border-bottom:1px solid #111111}
.org-tree{display:flex;flex-direction:column;align-items:center;padding:6px 0 10px}
.org-root{background:#111111;color:#ffffff;border-radius:16px;padding:12px 24px;font-weight:800;letter-spacing:.04em}
.org-lk{width:2px;height:22px;background:#111111}
.org-branch{display:flex;flex-direction:column;align-items:center;width:100%}
.org-role-node{border:2px solid #111111;border-radius:14px;padding:8px 16px;font-weight:700;background:#ffffff}
.org-kids{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.org-kid{display:flex;align-items:center;gap:8px;background:#f4f4f4;border-radius:999px;padding:6px 14px 6px 6px;font-weight:600}
@media (max-width:700px){.org-kan{grid-template-columns:1fr}.org-hero{gap:8px}.org-hero b{font-size:1.4rem}}

.ad-hero{background:#111111;color:#ffffff;border-radius:20px;padding:22px 20px;margin-bottom:14px;position:relative;overflow:hidden}
.ad-hero::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07)}
.ad-hero::after{content:"";position:absolute;right:30px;bottom:-78px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.05)}
.ad-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative}
.ad-hero h2{margin:0 0 3px;color:#ffffff;font-size:1.25rem}
.ad-hero-sub{color:#bbbbbb;font-size:.84rem;margin:0}
.ad-clock{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;text-align:right;white-space:nowrap}
.ad-clock-date{color:#bbbbbb;font-size:.76rem;text-align:right;margin-top:2px;text-transform:capitalize}
.ad-clock-tag{display:inline-block;margin-top:12px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 12px;font-size:.7rem;font-weight:700;letter-spacing:.04em;position:relative}
#admin .ad-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
#admin .ad-kpi{background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:13px 14px}
#admin .ad-kpi.warn{border:2px solid #111111}
#admin .ad-kpi b{display:block;font-size:1.6rem;line-height:1.1}
#admin .ad-kpi span{color:var(--muted);font-size:.78rem}
#admin .ad-quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
#admin .ad-qbtn{display:flex;justify-content:space-between;align-items:center;gap:8px;border:1px solid var(--line);background:#ffffff;border-radius:14px;padding:13px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:left;color:#111111}
#admin .ad-qbtn:hover{border-color:#111111}
#admin .ad-feed{background:#ffffff;border:1px solid var(--line);border-radius:16px;padding:4px 16px;margin-bottom:14px}
#admin .ad-feed-row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;font:inherit;text-align:left}
#admin .ad-feed-row:first-child{border-top:0}
#admin .ad-feed-tag{flex:none;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.03em;background:#f1f1f1;border-radius:999px;padding:3px 9px;color:#111111}
#admin .ad-feed-main{min-width:0;flex:1}
#admin .ad-feed-main b{display:block;font-size:.93rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#admin .ad-feed-main span{color:var(--muted);font-size:.8rem}
#admin .ad-feed-time{flex:none;color:var(--muted);font-size:.76rem}
#admin .ad-feed-empty{padding:16px 0;color:var(--muted);font-size:.9rem}
#admin .ad-two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
#admin .ad-two .card{margin-bottom:0}
#admin .ad-mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
#admin .ad-mini:first-of-type{border-top:0}
#admin button.ad-mini{width:100%;background:none;border:0;border-top:1px solid var(--line);cursor:pointer;text-align:left;font:inherit;color:#111111;padding:10px 0}
#admin button.ad-mini:first-of-type{border-top:0}
#admin .ad-mini b{font-size:.93rem}
#admin .ad-mini .note{font-size:.8rem}
#admin .ad-pill{flex:none;background:#111111;color:#ffffff;border-radius:999px;font-size:.72rem;font-weight:700;padding:3px 10px;white-space:nowrap}

#admin .ad-cars{display:flex;gap:10px;overflow-x:auto;padding:10px 2px 2px;margin:0 -2px}
#admin .ad-car-card{flex:0 0 148px;background:#ffffff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#admin .ad-car-img{width:100%;height:92px;object-fit:cover;background:#f1f1f1;display:block}
#admin .ad-car-body{padding:9px 10px 11px}
#admin .ad-car-body b{display:block;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#admin .ad-car-body .note{font-size:.76rem;margin:2px 0 6px}
#admin .ad-pill.off{background:#f1f1f1;color:#5a5a5a}
#admin .ad-rank{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
#admin .ad-rank:first-of-type{border-top:0}
#admin .ad-rank-n{flex:none;width:24px;height:24px;border-radius:50%;background:#111111;color:#ffffff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.74rem}
#admin .ad-rank-main{flex:1;min-width:0}

/* Photos des voitures : compression avant envoi */
function shrink(file){
  return new Promise(function(res, rej){
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function(){
      var s = Math.min(1, 720 / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.65));
    };
    img.onerror = function(){ rej(new Error("img")); };
    img.src = url;
  });
}

  var img = h("img", {alt:"", hidden:""});

  var inp = h("input", {class:"pfile", type:"file", accept:"image/*"});
  var xBtn = h("button", {type:"button", class:"ph-x", "aria-label":"Retirer cette photo", hidden:""}, ["×"]);
  var tile = h("label", {class:"ph-tile"}, [span, inp, img, xBtn]);
  inp.addEventListener("change", function(){
    var f = inp.files[0];
    if (!f) return;
    span.textContent = "Chargement…";
    shrink(f).then(function(u){
      img.src = u; img.hidden = false; xBtn.hidden = false; span.hidden = true; tile.classList.add("ph-filled");
      onChange(u);
    }).catch(function(){
      inp.value = ""; span.textContent = "Échec, réessayez";
      setTimeout(function(){ span.textContent = "Ajouter"; }, 3000);
    });
  });
  xBtn.addEventListener("click", function(e){
    e.preventDefault(); e.stopPropagation();
    inp.value = ""; img.hidden = true; img.removeAttribute("src"); xBtn.hidden = true; span.hidden = false; tile.classList.remove("ph-filled");
    onChange(null);
  });
  return tile;
}

        ["Disponible", "Indisponible"].map(function(s){ var o = h("option", {}, [s]); if ((s === "Disponible") === !!r.available) o.selected = true; return o; }));
      var del = h("button", {type:"button", class:"btn btn-ghost btn-small", onclick:function(){
        if (!del.classList.contains("ad-sure")) { del.classList.add("ad-sure"); del.textContent = "Confirmer ?"; return; }
        adApi("DELETE", path).then(adLoad).catch(adErr); }}, ["Supprimer"]);
      info.append(h("div", {class:"ad-row"}, [sel, del]));
      ls.append(h("div", {class:"card"}, [info]));
    } else {
      var parts = msgDetailParts(r.details);
      var meta = [h("div", {}, [h("b", {}, ["Reçu le"]), h("span", {}, [new Date(r.created_at).toLocaleString("fr-FR")])])];
      if (r.phone) meta.push(h("div", {}, [h("b", {}, ["Téléphone"]), h("a", {href:"tel:" + String(r.phone).replace(/[^\d+]/g, "")}, [r.phone])]));
      parts.forEach(function(p){ meta.push(h("div", {}, [h("b", {}, [p.label || "Détail"]), h("span", {}, [p.value])])); });
      path = "messages?id=eq." + r.id;
      sel = h("select", {"aria-label":"Statut", onchange:function(){ adApi("PATCH", path, {status:sel.value}).then(adLoad).catch(adErr); }},
        STAT[AD.tab].map(function(s){ var o = h("option", {}, [s]); if (s === r.status) o.selected = true; return o; }));
      var delMsg = h("button", {type:"button", class:"btn btn-ghost btn-small", onclick:function(){
        if (!delMsg.classList.contains("ad-sure")) { delMsg.classList.add("ad-sure"); delMsg.textContent = "Confirmer ?"; return; }
        adApi("DELETE", path).then(adLoad).catch(adErr); }}, ["Supprimer"]);
      info = h("div", {class:"acc-card"}, [
        h("div", {class:"acc-top"}, [
          h("div", {}, [h("div", {class:"acc-name"}, [r.name || "Sans nom"])]),
          h("span", {class:"acc-badge" + (r.status === "Nouvelle" ? " ok" : "")}, [r.status || "—"])]),
        h("div", {class:"acc-meta"}, meta)]);
      if (r.photos && r.photos.length) info.append(accPhotoGroup("Photos", r.photos, null));
      info.append(h("div", {class:"acc-foot"}, [sel, delMsg]));
      msgGrid.append(info);
    }
  });
  if (msgGrid) ls.append(msgGrid);
}


document.body.classList.add("admin-mode");
adDraw(); adLoad();
setInterval(adLoad, 10000);
</script>
